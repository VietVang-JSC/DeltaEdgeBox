[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
unserialize_max_depth = 4096
serialize_precision = -1
disable_functions =
disable_classes =
zend.enable_gc = On
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = "C:\DeltaPOS\edge-box\storage\logs\php-error.log"
register_argc_argv = Off
auto_globals_jit = On
post_max_size = 100M
auto_prepend_file =
auto_append_file =
default_mimetype = "text/html"
default_charset = "UTF-8"
doc_root =
user_dir =
enable_dl = Off
file_uploads = On
upload_max_filesize = 50M
max_file_uploads = 20
allow_url_fopen = On
allow_url_include = Off
default_socket_timeout = 60
date.timezone = Asia/Ho_Chi_Minh
session.save_handler = files
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.name = DELTAPOS_SESSID
session.auto_start = 0
session.cookie_httponly = 1
session.sid_length = 48

[PHP_CORE]
extension_dir = "ext"
extension=curl
extension=gd
extension=mbstring
extension=exif
extension=openssl
extension=pdo_sqlite
extension=sqlite3
extension=fileinfo
extension=bcmath
extension=ctype
extension=dom
extension=simplexml
extension=xml
extension=xmlwriter
extension=xmlreader
extension=zip
extension=soap
extension=sockets
extension=tokenizer
extension=json
extension=session
extension=filter
extension=posix

[Date]
date.timezone = Asia/Ho_Chi_Minh

[curl]
curl.cainfo = "C:\DeltaPOS\php\cacert.pem"
; For custom install path, update this path or copy cacert.pem next to php.exe

[openssl]
openssl.cafile = "C:\DeltaPOS\php\cacert.pem"
